<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2EA043" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2EA043" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes radar {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      .node { animation: pulse 3s infinite ease-in-out; }
      .floating { animation: float 4s infinite ease-in-out; }
      .radar-wave { animation: radar 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 14px;
        fill: #8B949E;
        letter-spacing: 0.5px;
      }
      .status-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        fill: #C9D1D9;
      }
      .badge-label {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #58A6FF;
      }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgGradient)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Background Circuit / Matrix Grid Details -->
  <g opacity="0.18">
    <line x1="40" y1="20" x2="40" y2="200" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="860" y1="20" x2="860" y2="200" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="40" y1="60" x2="860" y2="60" stroke="#30363D" stroke-width="0.8"/>
    <line x1="40" y1="160" x2="860" y2="160" stroke="#30363D" stroke-width="0.8"/>
    <!-- Circuit Lines -->
    <path d="M 680 40 L 720 40 L 740 70 L 820 70" stroke="#79C0FF" stroke-width="1.2" fill="none"/>
    <circle cx="820" cy="70" r="3" fill="#58A6FF"/>
    <path d="M 120 180 L 160 180 L 180 150 L 260 150" stroke="#2EA043" stroke-width="1.2" fill="none"/>
    <circle cx="260" cy="150" r="3" fill="#2EA043"/>
  </g>

  <!-- Ambient Glow Behind Title -->
  <circle cx="280" cy="90" r="90" fill="#1F6FEB" opacity="0.12" filter="url(#glow)"/>
  <circle cx="720" cy="110" r="80" fill="#2EA043" opacity="0.08" filter="url(#glow)"/>

  <!-- Status Pill Badge (Top Left) -->
  <g transform="translate(50, 32)">
    <rect width="270" height="26" rx="13" fill="url(#badgeBg)" stroke="#30363D" stroke-width="1"/>
    <!-- Radar pulsing dot -->
    <circle cx="16" cy="13" r="4" fill="#2EA043"/>
    <circle cx="16" cy="13" r="4" fill="none" stroke="#2EA043" stroke-width="1.5" class="radar-wave"/>
    <text x="28" y="17" class="status-pill">AVAILABLE FOR WORK • REMOTE / HYBRID</text>
  </g>

  <!-- Location Badge (Top Right) -->
  <g transform="translate(680, 32)">
    <rect width="170" height="26" rx="13" fill="url(#badgeBg)" stroke="#30363D" stroke-width="1"/>
    <text x="18" y="17" class="status-pill">📍 MALLORCA, ESPAÑA</text>
  </g>

  <!-- Main Hero Title -->
  <text x="50" y="105" fill="url(#textGradient)" class="title-text">
    Pere Joan Sancho Suñer
  </text>

  <!-- Subtitle -->
  <text x="50" y="132" class="subtitle-text">
    Software Engineer <tspan fill="#58A6FF">/</tspan> Backend-First Architect <tspan fill="#58A6FF">/</tspan> Cryptographic Trust
  </text>

  <!-- Bottom Badges / Tech Focus Pills -->
  <g transform="translate(50, 155)">
    <!-- Pill 1: Python/Django -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="18" class="badge-label">🐍 Python / Django</text>
    </g>
    <!-- Pill 2: X.509 PKI -->
    <g transform="translate(148, 0)">
      <rect width="138" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="18" class="badge-label">🔐 X.509 &amp; TSA RFC3161</text>
    </g>
    <!-- Pill 3: React 19 -->
    <g transform="translate(294, 0)">
      <rect width="112" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="18" class="badge-label">⚛️ React 19 / JS</text>
    </g>
    <!-- Pill 4: Operational Leadership -->
    <g transform="translate(414, 0)">
      <rect width="170" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="12" y="18" class="badge-label">⚡ +6y Ops Leadership</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="50" y1="205" x2="850" y2="205" stroke="url(#lineGradient)" stroke-width="2"/>
</svg>
