<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0B0F15"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="45%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="25%" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#2EA043" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2EA043" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulseRing {
        0% { r: 38px; opacity: 0.6; }
        50% { r: 48px; opacity: 0.1; }
        100% { r: 38px; opacity: 0.6; }
      }
      @keyframes radar {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      .floating-shield { animation: float 4s infinite ease-in-out; }
      .pulsing-ring { animation: pulseRing 3.5s infinite ease-in-out; }
      .radar-wave { animation: radar 2s infinite cubic-bezier(0, 0.2, 0.8, 1); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        font-weight: 800;
        font-size: 35px;
        letter-spacing: -0.6px;
      }
      .subtitle-text {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 13.5px;
        fill: #8B949E;
        letter-spacing: 0.3px;
      }
      .status-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #C9D1D9;
      }
      .badge-label {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #58A6FF;
      }
      .chip-text {
        font-family: 'Fira Code', monospace;
        font-size: 9.5px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgGradient)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Background Technical Grid & Trace Details -->
  <g opacity="0.16">
    <line x1="45" y1="20" x2="45" y2="200" stroke="#58A6FF" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="45" y1="62" x2="855" y2="62" stroke="#30363D" stroke-width="0.8"/>
    <line x1="45" y1="156" x2="855" y2="156" stroke="#30363D" stroke-width="0.8"/>
    <circle cx="240" cy="180" r="2" fill="#58A6FF"/>
    <circle cx="480" cy="40" r="2" fill="#2EA043"/>
  </g>

  <!-- Ambient Blue/Emerald Glows -->
  <circle cx="220" cy="100" r="95" fill="#1F6FEB" opacity="0.14" filter="url(#glow)"/>
  <circle cx="750" cy="115" r="85" fill="#2EA043" opacity="0.10" filter="url(#glow)"/>

  <!-- Status Pill Badge (Top Left) -->
  <g transform="translate(48, 28)">
    <rect width="265" height="24" rx="12" fill="url(#badgeBg)" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#2EA043"/>
    <circle cx="14" cy="12" r="3.5" fill="none" stroke="#2EA043" stroke-width="1.5" class="radar-wave"/>
    <text x="26" y="16" class="status-pill">AVAILABLE FOR WORK • REMOTE / HYBRID</text>
  </g>

  <!-- Main Hero Title -->
  <text x="48" y="98" fill="url(#textGradient)" class="title-text">
    Pere Joan Sancho Suñer
  </text>

  <!-- Subtitle -->
  <text x="48" y="125" class="subtitle-text">
    Software Engineer <tspan fill="#58A6FF">/</tspan> Backend-First Architect <tspan fill="#58A6FF">/</tspan> Cryptographic Trust
  </text>

  <!-- Bottom Badges / Tech Focus Pills -->
  <g transform="translate(48, 148)">
    <!-- Pill 1: Python/Django -->
    <g transform="translate(0, 0)">
      <rect width="138" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="11" y="17" class="badge-label">🐍 Python / Django</text>
    </g>
    <!-- Pill 2: X.509 PKI -->
    <g transform="translate(146, 0)">
      <rect width="144" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="11" y="17" class="badge-label">🔐 X.509 &amp; RFC3161</text>
    </g>
    <!-- Pill 3: React 19 -->
    <g transform="translate(298, 0)">
      <rect width="112" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="11" y="17" class="badge-label">⚛️ React 19 / JS</text>
    </g>
    <!-- Pill 4: Operational Leadership -->
    <g transform="translate(418, 0)">
      <rect width="160" height="26" rx="5" fill="#161B22" stroke="#30363D"/>
      <text x="11" y="17" class="badge-label">⚡ +6y Ops Leadership</text>
    </g>
  </g>

  <!-- ==================== BESPOKE CRYPTOGRAPHIC EMBLEM (RIGHT SIDE) ==================== -->
  <g transform="translate(735, 110)" class="floating-shield">
    <!-- Connecting Circuit Traces -->
    <path d="M -90 -20 L -60 -20 L -40 0" stroke="#58A6FF" stroke-width="1.2" opacity="0.4" fill="none"/>
    <path d="M -90 30 L -50 30 L -35 10" stroke="#2EA043" stroke-width="1.2" opacity="0.4" fill="none"/>

    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="42" stroke="#58A6FF" stroke-width="1" stroke-dasharray="4 4" fill="none" class="pulsing-ring"/>

    <!-- Hexagonal Shield Outer -->
    <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#161B22" stroke="url(#shieldGrad)" stroke-width="2"/>

    <!-- Inner Concentric Hexagon -->
    <polygon points="0,-27 24,-13 24,13 0,27 -24,13 -24,-13" fill="#0D1117" stroke="#58A6FF" stroke-width="1" opacity="0.6"/>

    <!-- Padlock Vector Icon -->
    <!-- Shackle -->
    <path d="M -7 -4 L -7 -10 A 7 7 0 0 1 7 -10 L 7 -4" stroke="#79C0FF" stroke-width="2" fill="none"/>
    <!-- Body -->
    <rect x="-10" y="-4" width="20" height="15" rx="2.5" fill="#1F6FEB" stroke="#58A6FF" stroke-width="1.2"/>
    <!-- Keyhole -->
    <circle cx="0" cy="2" r="1.8" fill="#FFFFFF"/>
    <path d="M -0.9 3 L 0.9 3 L 1.2 7 L -1.2 7 Z" fill="#FFFFFF"/>

    <!-- Floating Cryptographic Tags -->
    <!-- Tag 1: SHA-256 -->
    <g transform="translate(-62, -36)">
      <rect width="56" height="18" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="6" y="12" fill="#58A6FF" class="chip-text">SHA-256</text>
    </g>
    <!-- Tag 2: PKI -->
    <g transform="translate(18, 26)">
      <rect width="58" height="18" rx="4" fill="#0D1117" stroke="#30363D"/>
      <text x="6" y="12" fill="#2EA043" class="chip-text">X.509 PKI</text>
    </g>
  </g>

  <!-- Location Badge (Top Right) -->
  <g transform="translate(688, 28)">
    <rect width="165" height="24" rx="12" fill="url(#badgeBg)" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="16" class="status-pill">📍 MALLORCA, ESPAÑA</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <line x1="48" y1="198" x2="852" y2="198" stroke="url(#lineGradient)" stroke-width="2"/>
</svg>
